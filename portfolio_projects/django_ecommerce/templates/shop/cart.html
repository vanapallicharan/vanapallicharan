{% extends "shop/base.html" %}
{% block content %}
<h2>Cart</h2>
{% for item in items %}
  <p>{{ item.product.name }} x {{ item.quantity }} - Rs. {{ item.line_total }}</p>
{% empty %}
  <p>Your cart is empty.</p>
{% endfor %}
<h3>Total: Rs. {{ total }}</h3>
{% if items %}
  <a href="{% url 'checkout' %}">Checkout</a>
{% endif %}
{% endblock %}
